name: Validate links

on:
  push:
    paths:
      - dir/links.json
      - dir/links.schema.json
      - scripts/validate-links.mjs
      - package.json
      - package-lock.json
      - .github/workflows/validate-links.yml
  pull_request:
    paths:
      - dir/links.json
      - dir/links.schema.json
      - scripts/validate-links.mjs
      - package.json
      - package-lock.json
      - .github/workflows/validate-links.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate dir/links.json
        run: npm run validate:links
